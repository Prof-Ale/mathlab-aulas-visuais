<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathLab Aulas Visuais v1.5 — Prof. Alê Barbosa</title>
<meta name="description" content="Ferramenta de autoria docente: crie, edite, audite e exporte aulas e apostilas visuais de qualquer disciplina.">
<link rel="icon" type="image/jpeg" href="assets/logo-mathlab-selo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--navy:#14264f;--navy2:#1d3770;--gold:#f2b705;--bg:#f2f4f9;--card:#fff;--line:#d6dcea;--ink:#1d2433;--mut:#5a6682;--ok:#1d8f4e;--bad:#c9382f;--warn:#b7791f}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.top{background:var(--navy);color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.brand{display:flex;gap:10px;align-items:center;font-size:1.15rem}.brand small{display:block;font-size:.72rem;color:#b9c6e6}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--navy);font-weight:900;font-size:1.5rem}
.logo-img{width:42px;height:42px;border-radius:10px;object-fit:cover;border:2px solid var(--gold);background:#fff}
.gold{color:var(--gold)}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:transparent;border:0;color:#cfd9f2;padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:.92rem}
nav button:hover{background:var(--navy2)}nav button.on{background:var(--gold);color:var(--navy);font-weight:700}
main{max-width:1100px;margin:18px auto;padding:0 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
h2{margin:.2em 0 .5em;color:var(--navy)}h3{margin:.2em 0 .4em;color:var(--navy2)}
label{display:block;font-size:.82rem;font-weight:600;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #f2b70588;outline-offset:1px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button.b{background:var(--navy);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
button.b:hover{background:var(--navy2)}button.gold{background:var(--gold);color:var(--navy)}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.danger{background:var(--bad)}
button.sm{padding:4px 9px;font-size:.82rem}
.muted{color:var(--mut);font-size:.88rem}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:#e8edf8;color:var(--navy)}
.pill.ok{background:#dcf5e6;color:#126134}.pill.bad{background:#fde3e1;color:#a8241c}.pill.warn{background:#fff1d1;color:#7a4e08}
.style-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:10px 0}
.style-opt{text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.style-opt.on{border-color:var(--navy);background:#eef4ff;box-shadow:0 0 0 2px #14264f22}
.style-opt b{display:block;color:var(--navy);margin-bottom:2px}
.style-opt small{display:block;color:var(--mut);font-size:.82rem}
.list-item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fafbfe}
.blk{border:1px solid var(--line);border-left:6px solid var(--navy);border-radius:10px;padding:10px 12px;margin:10px 0;background:#fcfdff}
.blk .head{display:grid;grid-template-columns:200px 1fr auto;gap:8px;align-items:end}
@media(max-width:700px){.blk .head{grid-template-columns:1fr}}
.dirty{color:var(--warn);font-weight:700}
.two{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.1fr);gap:16px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.preview{border:1px dashed var(--line);border-radius:12px;padding:10px;background:#fff;overflow:auto}
iframe.pv{width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:#fff}
.bar{height:12px;background:#e6eaf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.score{font-size:3rem;font-weight:800;color:var(--navy);line-height:1}
.cat{display:grid;grid-template-columns:200px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
@media(max-width:600px){.cat{grid-template-columns:1fr 60px}.cat span:first-child{grid-column:1/-1}}
.find{font-size:.88rem;margin:2px 0 2px 12px}.find.hard{color:var(--bad);font-weight:600}.find.warn{color:var(--warn)}.find.info{color:var(--mut)}
pre.code{background:#0f1b38;color:#e7edff;padding:12px;border-radius:10px;overflow:auto;font-size:.82rem;white-space:pre-wrap;max-height:260px}
details{margin:6px 0}summary{cursor:pointer;color:var(--navy2);font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:50;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#toast.err{background:var(--bad)}
.foot{text-align:center;color:var(--mut);font-size:.8rem;padding:14px}
.step{counter-increment:s;position:relative;padding-left:38px;margin:10px 0}
.step:before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800}
.steps{counter-reset:s}
.empty{text-align:center;padding:30px;color:var(--mut)}
@media print{.top,.foot,#toast{display:none}}

</style>
</head>
<body>
<header class="top">
  <div class="brand"><img class="logo-img" src="assets/logo-mathlab-selo.jpg" alt="MathLab Educação"><div><strong>MathLab</strong> <span class="gold">Aulas Visuais</span> <span class="gold">v1.5</span><small>Psicologia Histórico-Cultural · Prof. Alê Barbosa</small></div></div>
  <nav id="tabs" role="tablist" aria-label="Seções"></nav>
</header>
<main id="main" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<footer class="foot">MathLab Aulas Visuais <span id="ver"></span> · Seus dados ficam só neste navegador · O professor valida o material antes de usar</footer>
<script>
/* MathLab Aulas Visuais — núcleo (sem dependências). Funciona no navegador e no Node (testes). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.MathLabCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const VERSION = '1.5.0';
  const SCHEMA = 'mathlab.material/2';
  const DEFAULT_AUTHOR = 'Prof. Alê Barbosa';

  const INTERIOR_STYLES = {
    editorial: 'Editorial Clean (respiro, pílula de página, abertura com guia e colofão)',
    ludico: 'Lúdico / HQ (caixas coloridas numeradas)',
  };

  const AVATAR_OPTIONS = {
    'avatar-prof-ale-1.jpg': 'Prof. Alê — Jaleco e Livro (Pesquisa)',
    'avatar-prof-ale-2.jpg': 'Prof. Alê — Moletom MathLab',
    'avatar-prof-ale-3.jpg': 'Prof. Alê — Camisa Marinho MathLab',
    'avatar-prof-ale-4.jpg': 'Prof. Alê — Camisa Branca e Logo',
    svg: 'Mascote ilustrado (SVG offline)',
  };

  const LOGO_OPTIONS = {
    'logo-mathlab-clean.jpg': 'Logo MathLab — Fundo Claro',
    'logo-mathlab-selo.jpg': 'Selo Circular MathLab (Marinho e Dourado)',
    none: 'Sem logo',
  };

  const BLOCK_PEDAGOGY = {
    problematizacao: 'Vivência & Problema (Conceitos Cotidianos)',
    contexto: 'Contexto Histórico-Cultural',
    conceito: 'Conceito Científico & Mediação Semiótica',
    visual: 'Mediação Visual & Signos',
    exemplo: 'Exemplo Mediado Passo a Passo',
    atividade: 'Prática na ZDP (Com Apoio / Em Dupla)',
    exercicios: 'Desafios Graduados (Níveis 1 → 3)',
    gabarito: 'Conferência Comentada & Reflexão',
    avaliacao: 'Avaliação Formativa',
    acessibilidade: 'Desenho Universal & Acessibilidade',
    nota: 'Alerta Conceitual & Erros Típicos',
  };

  const CONTENT_PROFILES = {
    completo: 'Apostila completa (problematização, desenvolvimento conceitual, exemplos, atividade, exercícios graduados e gabarito)',
    expositivo: 'Somente exposição conceitual e exemplos analisados (sem exercícios nem gabarito)',
    expositivo_visual: 'Exposição conceitual + recursos visuais + exemplos (sem exercícios)',
    pratica: 'Foco em exercícios graduados + gabarito comentado',
  };

  /* ---------- utilidades ---------- */
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const uid = (p) => (p || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  const wc = (s) => String(s || '').trim().split(/\s+/).filter(Boolean).length;
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const strip = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const minus = (v) => (v < 0 ? '−' + Math.abs(v) : String(v));

  /* ---------- tipos de conhecimento e blocos ---------- */
  const EPISTEMIC = {
    formal: { label: 'Formal (Matemática, Lógica, Estatística)', labels: ['Conceito', 'Desenvolvimento', 'Na prática', 'Pegadinhas', 'Resumo estratégico'] },
    empirica: { label: 'Empírica (Física, Química, Biologia, Ciências)', labels: ['O fenômeno', 'O modelo', 'Evidências', 'Erros comuns', 'Resumo estratégico'] },
    interpretativa: { label: 'Interpretativa (Filosofia, Sociologia, Literatura, Artes)', labels: ['A questão', 'Conceitos', 'Argumentos', 'Objeções', 'Resumo estratégico'] },
    historica: { label: 'Histórica (História, Geografia humana)', labels: ['Contexto', 'Fatos', 'Fontes', 'Consequências', 'Resumo estratégico'] },
    linguistica: { label: 'Linguística (Português, Línguas, Redação)', labels: ['Uso', 'Regra', 'Exemplos', 'Armadilhas', 'Resumo estratégico'] },
    pratica: { label: 'Prática (Ed. Física, Informática, Técnicos, Música)', labels: ['Para que serve', 'Passo a passo', 'Cuidados', 'Erros comuns', 'Resumo estratégico'] },
    geral: { label: 'Geral / mista', labels: ['Conceito', 'Desenvolvimento', 'Na prática', 'Pegadinhas', 'Resumo estratégico'] },
  };

  const BLOCK_TYPES = {
    problematizacao: ['Problematização', '💡'],
    contexto: ['Contexto', '🧭'],
    conceito: ['Desenvolvimento conceitual', '📘'],
    exemplo: ['Exemplo resolvido / analisado', '✏️'],
    visual: ['Recurso visual', '🖼️'],
    atividade: ['Atividade orientada', '🧩'],
    exercicios: ['Exercícios graduados', '📝'],
    gabarito: ['Gabarito comentado', '✅'],
    avaliacao: ['Avaliação formativa', '🎯'],
    acessibilidade: ['Acessibilidade', '♿'],
    nota: ['Nota', '📌'],
  };

  function detectType(discipline) {
    const d = strip(discipline);
    const has = (...k) => k.some((x) => d.includes(x));
    if (has('educacao fisica', 'informatica', 'programacao', 'musica', 'tecnic', 'culinaria', 'enfermagem', 'robotica')) return 'pratica';
    if (has('matematica', 'logica', 'geometria', 'algebra', 'estatistica', 'aritmetica', 'calculo')) return 'formal';
    if (has('fisica', 'quimica', 'biologia', 'ciencias', 'astronomia')) return 'empirica';
    if (has('portugues', 'lingua', 'ingles', 'espanhol', 'redacao', 'gramatica', 'frances')) return 'linguistica';
    if (has('historia', 'arqueologia')) return 'historica';
    if (has('filosofia', 'sociologia', 'literatura', 'arte', 'religios', 'psicologia', 'direito', 'etica')) return 'interpretativa';
    return 'geral';
  }

  /* ---------- SVG seguro ---------- */
  const DANGEROUS = /<script|<foreignObject|<iframe|<image\b|\son\w+\s*=|javascript:/i;
  function sanitizeSvg(s) {
    s = String(s || '');
    if (!/<svg[\s>]/i.test(s)) return '';
    return s
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi, '')
      .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
      .replace(/<image\b[^>]*>(\s*<\/image>)?/gi, '')
      .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
      .replace(/(xlink:href|href)\s*=\s*("|')\s*javascript:[^"']*\2/gi, '');
  }

  /* ---------- Markdown mínimo e seguro ---------- */
  // fórmula = $...$ cujo $ de abertura não vem colado em letra/número (assim "R$ 40" não vira fórmula)
  const MATH_RE = /(^|[^\w$])\$(?=\S)([^$\n]*?\S)\$(?!\w)/g;
  const MATH_OPEN = /(^|[^\w$])\$(?=\S)/;
  function inline(s) {
    const stash = [];
    const keep = (h) => '\u0000' + (stash.push(h) - 1) + '\u0000';
    s = String(s);
    s = s.replace(/`([^`]+)`/g, (_, c) => keep('<code>' + esc(c) + '</code>'));
    s = s.replace(MATH_RE, (_, pre, c) => pre + keep('<span class="math">' + esc(c) + '</span>'));
    s = esc(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => stash[+i]);
  }

  function renderMarkdown(md) {
    const L = String(md || '').replace(/\r/g, '').split('\n');
    const out = [];
    let i = 0;
    const special = (l) => /^(#{1,4})\s/.test(l) || /^\s*[-*]\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l) || /^\s*\|/.test(l) || /^>\s?/.test(l);
    while (i < L.length) {
      const l = L[i];
      if (!l.trim()) { i++; continue; }
      let m;
      if ((m = l.match(/^(#{1,4})\s+(.*)/))) { const n = Math.min(6, m[1].length + 2); out.push('<h' + n + '>' + inline(m[2]) + '</h' + n + '>'); i++; continue; }
      if (/^\s*[-*]\s+/.test(l)) {
        const it = [];
        while (i < L.length && /^\s*[-*]\s+/.test(L[i])) { it.push('<li>' + inline(L[i].replace(/^\s*[-*]\s+/, '')) + '</li>'); i++; }
        out.push('<ul>' + it.join('') + '</ul>'); continue;
      }
      if ((m = l.match(/^\s*(\d+)[.)]\s+/))) {
        const start = +m[1]; const it = [];
        while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) { it.push('<li>' + inline(L[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); i++; }
        out.push('<ol start="' + start + '">' + it.join('') + '</ol>'); continue;
      }
      if (/^\s*\|/.test(l) && L[i + 1] && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
        const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const head = cells(l); i += 2; const rows = [];
        while (i < L.length && /^\s*\|/.test(L[i])) { rows.push(cells(L[i])); i++; }
        out.push('<table><thead><tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
        continue;
      }
      if (/^>\s?/.test(l)) {
        const q = [];
        while (i < L.length && /^>\s?/.test(L[i])) { q.push(L[i].replace(/^>\s?/, '')); i++; }
        out.push('<blockquote>' + inline(q.join(' ')) + '</blockquote>'); continue;
      }
      const p = [];
      while (i < L.length && L[i].trim() && !special(L[i])) { p.push(L[i]); i++; }
      if (!p.length) { p.push(L[i]); i++; }
      out.push('<p>' + p.map(inline).join('<br>') + '</p>');
    }
    return out.join('\n');
  }

  /* ---------- geradores de SVG (funcionam offline, qualquer disciplina) ---------- */
  const NAVY = '#14264f', GOLD = '#f2b705', BLUE = '#1e6fd9', GREEN = '#22a559', RED = '#d6453d', GREY = '#6b7690';

  function svgWrap(w, h, title, desc, inner) {
    const id = uid('s');
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-labelledby="' + id + 't ' + id + 'd" font-family="Arial, Helvetica, sans-serif">' +
      '<title id="' + id + 't">' + esc(title) + '</title><desc id="' + id + 'd">' + esc(desc) + '</desc>' + inner + '</svg>';
  }
  function wrapText(text, max) {
    const words = String(text).split(/\s+/); const lines = []; let cur = '';
    words.forEach((w) => { if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
    if (cur) lines.push(cur);
    return lines.slice(0, 4);
  }
  const tspans = (lines, x, y, lh) => lines.map((t, k) => '<tspan x="' + x + '" y="' + (y + k * lh) + '">' + esc(t) + '</tspan>').join('');

  function numberLine(o) {
    o = Object.assign({ min: -6, max: 6, marks: [], jump: null }, o || {});
    const W = 720, H = o.jump ? 190 : 120, pad = 40, y = o.jump ? 130 : 66;
    const x = (v) => pad + ((v - o.min) / (o.max - o.min)) * (W - 2 * pad);
    const step = o.max - o.min <= 30 ? 1 : Math.ceil((o.max - o.min) / 20);
    let g = '<line x1="' + (pad - 14) + '" y1="' + y + '" x2="' + (W - pad + 14) + '" y2="' + y + '" stroke="' + NAVY + '" stroke-width="3"/>';
    g += '<polygon points="' + (W - pad + 22) + ',' + y + ' ' + (W - pad + 8) + ',' + (y - 6) + ' ' + (W - pad + 8) + ',' + (y + 6) + '" fill="' + NAVY + '"/>';
    g += '<polygon points="' + (pad - 22) + ',' + y + ' ' + (pad - 8) + ',' + (y - 6) + ' ' + (pad - 8) + ',' + (y + 6) + '" fill="' + NAVY + '"/>';
    for (let v = o.min; v <= o.max; v += step) {
      g += '<line x1="' + x(v) + '" y1="' + (y - 8) + '" x2="' + x(v) + '" y2="' + (y + 8) + '" stroke="' + NAVY + '" stroke-width="2"/>';
      g += '<text x="' + x(v) + '" y="' + (y + 28) + '" text-anchor="middle" font-size="15" fill="' + NAVY + '" font-weight="' + (v === 0 ? 700 : 400) + '">' + minus(v) + '</text>';
    }
    if (o.jump) {
      const a = o.jump.from, b = a + o.jump.by, xa = x(a), xb = x(b), mid = (xa + xb) / 2, top = y - 86;
      g += '<path d="M ' + xa + ' ' + (y - 10) + ' Q ' + mid + ' ' + top + ' ' + (xb - (o.jump.by > 0 ? 3 : -3)) + ' ' + (y - 12) + '" fill="none" stroke="' + (o.jump.by >= 0 ? GREEN : RED) + '" stroke-width="4"/>';
      const dir = o.jump.by >= 0 ? -1 : 1;
      g += '<polygon points="' + xb + ',' + (y - 8) + ' ' + (xb + dir * 14) + ',' + (y - 24) + ' ' + (xb + dir * 4) + ',' + (y - 26) + '" fill="' + (o.jump.by >= 0 ? GREEN : RED) + '"/>';
      g += '<text x="' + mid + '" y="' + (top + 22) + '" text-anchor="middle" font-size="20" font-weight="700" fill="' + (o.jump.by >= 0 ? GREEN : RED) + '">' + (o.jump.by >= 0 ? '+' : '−') + Math.abs(o.jump.by) + '</text>';
      g += '<circle cx="' + xa + '" cy="' + y + '" r="8" fill="' + GOLD + '" stroke="' + NAVY + '" stroke-width="2"/>';
      g += '<circle cx="' + xb + '" cy="' + y + '" r="8" fill="' + BLUE + '" stroke="' + NAVY + '" stroke-width="2"/>';
    }
    (o.marks || []).forEach((m) => { g += '<circle cx="' + x(m) + '" cy="' + y + '" r="7" fill="' + GOLD + '" stroke="' + NAVY + '" stroke-width="2"/>'; });
    const desc = 'Reta numérica de ' + minus(o.min) + ' a ' + minus(o.max) + (o.jump ? ', com salto de ' + minus(o.jump.from) + ' para ' + minus(o.jump.from + o.jump.by) : '') + '.';
    return svgWrap(W, H, o.title || 'Reta numérica', desc, g);
  }

  function timeline(o) {
    const ev = (o && o.events) || []; const n = Math.max(ev.length, 1); const W = 760, H = 270, y = 135;
    let g = '<line x1="30" y1="' + y + '" x2="' + (W - 30) + '" y2="' + y + '" stroke="' + NAVY + '" stroke-width="4"/>';
    ev.forEach((e, i) => {
      const x = n === 1 ? W / 2 : 60 + (i * (W - 120)) / (n - 1); const up = i % 2 === 0;
      g += '<circle cx="' + x + '" cy="' + y + '" r="9" fill="' + GOLD + '" stroke="' + NAVY + '" stroke-width="3"/>';

  function buildImagePrompt(m) {

    if (p.subtitle) L.push('Subtítulo em faixa clara estilo manuscrito logo abaixo: "' + p.subtitle + '".');
    if (auth) L.push('Assinatura/Selo de autoria visível na capa: "' + auth + '".');
    L.push('PERSONAGEM MASCOTE: ' + (p.mascot || 'um estudante simpático e original, sorridente, segurando livros coloridos') + ' — personagem original, expressivo, com balões de fala curtos e ícones escolares ao redor (pilha de livros, lápis, lâmpada, globo).');
    L.push('CAIXAS NUMERADAS, cada uma com cor própria, borda grossa, sombra sólida, número em círculo e rótulo em destaque (escreva o texto exatamente como abaixo):');
    (p.sections || []).forEach((s, i) => L.push((i + 1) + ') ' + String(s.label || '').toUpperCase() + (s.title ? ' — ' + s.title : '') + ': "' + s.text + '"'));
    const ex = [];
    if (p.goldTip) ex.push('DICA DE OURO (ícone de lâmpada): "' + p.goldTip + '"');
    if (p.didYouKnow) ex.push('VOCÊ SABIA? (ícone de lâmpada ou interrogação): "' + p.didYouKnow + '"');
    if (p.attention) ex.push('ATENÇÃO AOS DETALHES! (ícone de alerta, caixa em vermelho): "' + p.attention + '"');
    if (ex.length) L.push('CAIXAS EXTRAS: ' + ex.join(' | '));
    if ((p.summary || []).length) L.push('FAIXA FINAL "EM RESUMO:" com ' + p.summary.length + ' ícones ilustrados e legendas curtas: ' + p.summary.map((s) => s.icon + ' "' + s.label + (s.text ? ' — ' + s.text : '') + '"').join('; ') + '.');
    L.push('REGRAS: todo o texto em português do Brasil, escrito exatamente como fornecido, sem erros de ortografia e sem inventar textos extras; letras grandes, manuscritas/arredondadas e legíveis; fundo claro com textura sutil; muitos ícones e pequenas ilustrações relacionadas ao assunto; hierarquia visual clara; sem marca d\'água de terceiros e sem personagens de filmes ou desenhos conhecidos.');
    return L.join('\n');
  }

  /* ---------- Pedido para colar no Gem/Claude/ChatGPT (modo sem custo) ---------- */
  function buildRequestText(r) {
    r = r || {};
    const t = r.type && r.type !== 'auto' ? r.type : detectType(r.discipline);
    const prof = CONTENT_PROFILES[r.contentProfile] ? r.contentProfile : 'completo';
    const auth = String(r.author || DEFAULT_AUTHOR).trim();
    return [
      'Use o MathLab Aulas Visuais para criar um material didático.',
      'Autor: ' + auth,
      'Base pedagógica: Psicologia Histórico-Cultural (Vigotski, Luria, Leontiev — ZDP, mediação semiótica e formação de conceitos científicos; sem confundir ZDP com scaffolding de Wood, Bruner & Ross, 1976).',
      'Disciplina: ' + (r.discipline || '[informe]'),
      'Etapa de ensino: ' + (r.level || '[informe]'),
      'Tema: ' + (r.topic || '[informe]'),
      'Duração: ' + (r.duration || '1 aula de 50 minutos'),
      'Tipo de conhecimento: ' + EPISTEMIC[t].label,
      'Perfil de conteúdo desejado (' + prof + '): ' + CONTENT_PROFILES[prof],
      prof === 'expositivo' || prof === 'expositivo_visual' ? 'ATENÇÃO: O professor solicitou SOMENTE exposição conceitual/exemplos, SEM lista de exercícios e SEM gabarito.' : '',
      'Extensão do miolo: SEM limite máximo de páginas — desenvolva com profundidade adequada ao tema e à duração.',
      r.objectives ? 'Objetivos desejados: ' + r.objectives : '',
      'Entregue o material (com caixas de destaque nos blocos) e a apostila visual (capa em pôster com author "' + auth + '") no formato ' + SCHEMA + '.',
      'Responda SOMENTE com um bloco de código JSON válido, sem texto antes nem depois.',
      'Não invente referências; se não pesquisou, deixe "references" vazio e declare a limitação em "limitations".',
    ].filter(Boolean).join('\n');
  }

  /* ---------- normalização, validação, importação ---------- */
  const CALLOUTS = { dica: ['💡 DICA DE OURO', 'gold'], sabia: ['🔎 VOCÊ SABIA?', 'know'], atencao: ['⚠️ ATENÇÃO AOS DETALHES!', 'warn'], prova: ['🎯 COBRANÇA EM PROVAS', 'prova'] };

  function normalize(o) {
    o = o && typeof o === 'object' ? o : {};
    const arr = (x) => (Array.isArray(x) ? x.map(String).filter((s) => s.trim()) : typeof x === 'string' && x.trim() ? x.split(/\n+/).map((s) => s.trim()).filter(Boolean) : []);
    const m = {
      schema: SCHEMA,
      title: String(o.title || o.titulo || '').trim(),
      author: String(o.author || o.autor || (o.poster && o.poster.author) || DEFAULT_AUTHOR).trim(),
      discipline: String(o.discipline || o.disciplina || '').trim(),
      level: String(o.level || o.etapa || '').trim(),
      topic: String(o.topic || o.tema || '').trim(),
      duration: String(o.duration || o.duracao || '').trim(),
      epistemicType: EPISTEMIC[o.epistemicType] ? o.epistemicType : detectType(o.discipline || o.disciplina),
      contentProfile: CONTENT_PROFILES[o.contentProfile] ? o.contentProfile : 'completo',
      objectives: arr(o.objectives), prerequisites: arr(o.prerequisites), limitations: arr(o.limitations),
      blocks: [], references: [], poster: null,
      meta: Object.assign({ generatedBy: 'manual', createdAt: new Date().toISOString() }, o.meta || {}),
    };
    (Array.isArray(o.blocks) ? o.blocks : []).forEach((b) => {
      if (!b || typeof b !== 'object') return;
      const type = BLOCK_TYPES[b.type] ? b.type : 'nota';
      const co = b.callout && typeof b.callout === 'object' && String(b.callout.text || '').trim() ? { kind: CALLOUTS[b.callout.kind] ? b.callout.kind : 'dica', text: String(b.callout.text).trim() } : null;
      m.blocks.push({ id: b.id || uid('b'), type, title: String(b.title || BLOCK_TYPES[type][0]), content: String(b.content || ''), svg: b.svg ? String(b.svg) : '', callout: co });
    });
    (Array.isArray(o.references) ? o.references : []).forEach((r) => {
      if (!r || typeof r !== 'object') return;
      m.references.push({ authors: String(r.authors || ''), title: String(r.title || ''), year: String(r.year || ''), venue: String(r.venue || ''), doi: String(r.doi || ''), url: String(r.url || ''),
        accessLevel: String(r.accessLevel || 'nao-verificado'), verified: !!r.verified });
    });
    if (o.poster && typeof o.poster === 'object') {
      const p = o.poster;
      const isLegacy = o.meta && o.meta.version && /^1\.[0-3]\./.test(String(o.meta.version));
      m.poster = {
        title: String(p.title || m.title), subtitle: String(p.subtitle || ''), author: String(p.author || m.author || DEFAULT_AUTHOR), mascot: String(p.mascot || ''),
        coverClean: p.coverClean !== false,
        interiorStyle: INTERIOR_STYLES[p.interiorStyle] ? p.interiorStyle : (isLegacy ? 'ludico' : 'editorial'),
        avatarChoice: AVATAR_OPTIONS[p.avatarChoice] ? p.avatarChoice : 'avatar-prof-ale-1.jpg',
        logoChoice: LOGO_OPTIONS[p.logoChoice] ? p.logoChoice : 'logo-mathlab-clean.jpg',
        videoTitle: String(p.videoTitle || '').trim(),
        videoUrl: String(p.videoUrl || '').trim(),
        sections: (Array.isArray(p.sections) ? p.sections : []).slice(0, 6).map((s, i) => ({ label: String(s.label || 'Seção ' + (i + 1)), title: String(s.title || ''), text: String(s.text || '') })),
        goldTip: String(p.goldTip || ''), didYouKnow: String(p.didYouKnow || ''), attention: String(p.attention || ''),
        summary: (Array.isArray(p.summary) ? p.summary : []).slice(0, 5).map((s) => ({ icon: String(s.icon || '⭐'), label: String(s.label || ''), text: String(s.text || '') })),
        theme: POSTER_THEMES[p.theme] ? p.theme : 'alegre',
      };
    }
    if (!m.title) m.title = m.topic || (m.poster && m.poster.title) || 'Material sem título';
    return m;
  }

  function parseModelJson(text) {
    let t = String(text || '').trim();
    const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) t = fence[1].trim();
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0 || b <= a) return { ok: false, error: 'Não encontrei um JSON na resposta. Cole o bloco inteiro que o Gem devolveu.' };
    try { return { ok: true, data: JSON.parse(t.slice(a, b + 1)) }; }
    catch (e) { return { ok: false, error: 'JSON inválido: ' + e.message + '. Peça ao Gem: "Reenvie apenas o JSON válido, completo".' }; }
  }

  function importFromText(text) {
    const r = parseModelJson(text); if (!r.ok) return r;
    const m = normalize(r.data);
    const warnings = [];
    if (!m.blocks.length && !m.poster) return { ok: false, error: 'O JSON não tem "blocks" nem "poster".' };
    if (!r.data.schema) warnings.push('O JSON não declara "schema"; importei assim mesmo.');
    if (m.meta.generatedBy === 'manual') m.meta.generatedBy = 'skill';
    return { ok: true, material: m, warnings };
  }

  /* ---------- auditoria (10 categorias, Hard Fail / Soft Warning) ---------- */
  const PLACEHOLDER = /\[PREENCHER|\bTODO\b|lorem ipsum|\[\.\.\.\]|\bXXX\b/i;
  const FILLER = ['e muito importante', 'nos dias de hoje', 'desde os primordios', 'sem duvida', 'vale ressaltar', 'como todos sabemos'];

  function audit(m) {
    m = normalize(m);
    const cats = [];
    const cat = (id, name) => { const c = { id, name, score: 10, findings: [] }; cats.push(c); return c; };
    const add = (c, sev, msg, pen) => { c.findings.push({ sev, msg }); c.score = Math.max(0, c.score - (pen != null ? pen : sev === 'hard' ? 10 : sev === 'warn' ? 2 : 0)); };
    const blocks = m.blocks; const has = (t) => blocks.some((b) => b.type === t);
    const allText = blocks.map((b) => b.title + ' ' + b.content).join(' ');
    const total = wc(allText);

    const c1 = cat('fundamentacao', 'Fundamentação científica');
    if (!m.references.length) {
      if (['empirica', 'historica', 'interpretativa'].includes(m.epistemicType)) add(c1, 'warn', 'Sem referências: para este tipo de conhecimento, a fundamentação em fontes é esperada.', 3);
      else add(c1, 'info', 'Sem referências. Aceitável em conteúdo consolidado, desde que declarado nas limitações.', 1);
      if (!m.limitations.length) add(c1, 'warn', 'Sem referências e sem declaração de limitação.', 2);
    }

    const c2 = cat('rastreabilidade', 'Rastreabilidade das fontes');
    m.references.forEach((r, i) => {
      const n = '#' + (i + 1) + ' ' + (r.title || '(sem título)');
      if (!r.title || !r.authors || !r.year) add(c2, 'hard', 'Referência ' + n + ' incompleta (autor, título e ano são obrigatórios): pode ser inventada.');
      if (!['integral', 'parcial', 'resumo', 'metadados', 'localizada', 'nao-verificado'].includes(r.accessLevel)) add(c2, 'warn', 'Referência ' + n + ' sem nível de acesso válido.', 2);
      if (['integral', 'parcial'].includes(r.accessLevel) && !r.doi && !r.url) add(c2, 'warn', 'Referência ' + n + ' declara acesso ' + r.accessLevel + ' sem DOI/URL para conferir.', 1);
      if (r.doi && !/^10\.\d{4,9}\/\S+$/.test(r.doi)) add(c2, 'warn', 'DOI da referência ' + n + ' fora do formato.', 2);
    });

    const c3 = cat('conceitual', 'Correção conceitual');
    const ph = blocks.filter((b) => PLACEHOLDER.test(b.title + ' ' + b.content));
    if (ph.length) add(c3, 'hard', 'Conteúdo ainda não preenchido (marcadores como [PREENCHER]) em ' + ph.length + ' bloco(s).');
    blocks.forEach((b) => { if (MATH_OPEN.test(b.content.replace(MATH_RE, '$1'))) add(c3, 'warn', 'Delimitador de fórmula "$" desbalanceado em "' + b.title + '".', 2); });
    add(c3, 'info', 'A verificação automática não confirma a correção científica. A revisão conceitual é do professor.', 0);

    const isExpository = m.contentProfile === 'expositivo' || m.contentProfile === 'expositivo_visual';
    const c4 = cat('alinhamento', 'Alinhamento construtivo');
    if (!m.objectives.length) add(c4, 'warn', 'Sem objetivos de aprendizagem.', 4);
    if (!isExpository) {
      if (!(has('atividade') || has('exercicios'))) add(c4, 'warn', 'Sem atividade ou exercícios que evidenciem o aprendizado.', 3);
      if (!(has('avaliacao') || has('gabarito'))) add(c4, 'warn', 'Sem avaliação formativa ou gabarito.', 2);
      const practice = strip(blocks.filter((b) => ['atividade', 'exercicios', 'exemplo', 'avaliacao'].includes(b.type)).map((b) => b.content).join(' '));
      let unc = 0;
      m.objectives.forEach((o) => {
        const keys = strip(o).split(/[^a-z0-9]+/).filter((w) => w.length >= 6);
        if (keys.length && !keys.some((k) => practice.includes(k.slice(0, 6))) && unc < 3) { unc++; add(c4, 'warn', 'Objetivo sem evidência aparente nas atividades: "' + o.slice(0, 70) + '".', 1); }
      });
    } else {
      add(c4, 'info', 'Perfil expositivo selecionado: exercícios e gabarito são opcionais.', 0);
    }

    const c5 = cat('progressao', 'Progressão didática');
    const idx = (t) => blocks.findIndex((b) => b.type === t);
    if (idx('conceito') >= 0 && idx('exercicios') >= 0 && idx('exercicios') < idx('conceito')) add(c5, 'warn', 'Exercícios aparecem antes do desenvolvimento conceitual.', 2);
    if (idx('problematizacao') >= 0 && idx('conceito') >= 0 && idx('problematizacao') > idx('conceito')) add(c5, 'warn', 'A problematização deveria vir antes do conceito.', 1);
    const ex = blocks.find((b) => b.type === 'exercicios');
    if (ex && (ex.content.match(/^\s*\d+[.)]/gm) || []).length < 3) add(c5, 'warn', 'Exercícios com menos de 3 itens numerados: sem graduação perceptível.', 1);

    const c6 = cat('substancia', 'Substância do conteúdo');
    if (total < 60) add(c6, 'hard', 'Conteúdo praticamente vazio (' + total + ' palavras).');
    else if (total < 250) add(c6, 'warn', 'Material curto (' + total + ' palavras). Verifique se atende à duração pedida.', 3);
    const cc = blocks.find((b) => b.type === 'conceito');
    if (cc && wc(cc.content) < 50) add(c6, 'warn', 'Desenvolvimento conceitual muito curto.', 2);
    const nf = FILLER.filter((f) => strip(allText).includes(f)).length;
    if (nf >= 3) add(c6, 'warn', 'Várias frases genéricas de enchimento detectadas.', 2);
    const seen = new Set(); blocks.forEach((b) => { const k = strip(b.content).slice(0, 120); if (k.length > 40 && seen.has(k)) add(c6, 'warn', 'Conteúdo repetido em "' + b.title + '".', 2); seen.add(k); });

    const c7 = cat('visual', 'Recursos visuais');
    const svgs = blocks.filter((b) => b.svg);
    if (!svgs.length && !m.poster) add(c7, 'warn', 'Nenhum recurso visual (figura SVG ou apostila visual).', 1);
    svgs.forEach((b) => {
      if (DANGEROUS.test(b.svg)) add(c7, 'hard', 'SVG de "' + b.title + '" contém código não permitido (script/evento/imagem externa).');
      if (!/<title[\s>]/i.test(b.svg)) add(c7, 'warn', 'SVG de "' + b.title + '" sem <title>.', 2);
    });
    if (m.poster) {
      const p = m.poster;
      if (p.sections.length < 4) add(c7, 'warn', 'Apostila visual com menos de 4 seções.', 2);
      const long = p.sections.filter((s) => wc(s.text) > 45).length;
      if (long) add(c7, 'warn', long + ' seção(ões) do pôster com mais de 45 palavras: IA de imagem erra letras em textos longos.', 1);
      if (PLACEHOLDER.test(JSON.stringify(p))) add(c7, 'hard', 'Apostila visual com campos ainda não preenchidos.');
    }

    const c8 = cat('acessibilidade', 'Acessibilidade');
    if (!has('acessibilidade')) add(c8, 'warn', 'Sem bloco de estratégias de acessibilidade.', 3);
    svgs.forEach((b) => { if (!/<desc[\s>]/i.test(b.svg)) add(c8, 'warn', 'SVG de "' + b.title + '" sem <desc> (descrição para leitor de tela).', 1); });
    if (m.poster && m.poster.theme === 'alegre') add(c8, 'info', 'Para impressão econômica e baixa fadiga visual, o tema "Suave" pode ser mais indicado.', 0);

    const c9 = cat('editorial', 'Qualidade editorial');
    if (!m.title || !m.discipline || !m.level) add(c9, 'warn', 'Faltam título, disciplina ou etapa de ensino.', 2);
    blocks.forEach((b) => {
      if (!b.content.trim() && !b.svg) add(c9, 'warn', 'Bloco "' + b.title + '" está vazio.', 2);
      if (wc(b.content) > 200 && !/\n\s*\n|^#{1,4}\s/m.test(b.content)) add(c9, 'warn', 'Bloco "' + b.title + '" é um parágrafo único muito longo.', 1);
    });

    const c10 = cat('honestidade', 'Completude e honestidade');
    if (!m.limitations.length) add(c10, 'warn', 'Nenhuma limitação declarada.', 3);
    if (m.meta.generatedBy === 'offline-scaffold') add(c10, 'warn', 'Estrutura gerada sem IA: é um esqueleto, não conteúdo final.', 3);
    if (['skill', 'gemini'].includes(m.meta.generatedBy)) add(c10, 'info', 'Conteúdo gerado por IA: revisão docente obrigatória antes do uso.', 0);
    if (m.references.some((r) => !r.verified && r.accessLevel !== 'nao-verificado')) add(c10, 'warn', 'Há referências com nível de acesso declarado, mas sem verificação marcada.', 2);

    const hard = []; const soft = [];
    cats.forEach((c) => c.findings.forEach((f) => { if (f.sev === 'hard') hard.push({ cat: c.name, msg: f.msg }); else if (f.sev === 'warn') soft.push({ cat: c.name, msg: f.msg }); }));
    const totalScore = Math.round((cats.reduce((a, c) => a + c.score, 0) / cats.length) * 10);
    const level = hard.length ? 'Reprovado: falha grave' : totalScore < 60 ? 'Rascunho' : totalScore < 80 ? 'Em revisão' : 'Pronto para revisão docente';
    return { score: totalScore, level, hard, soft, categories: cats, words: total,
      note: 'Auditoria automática por regras. Não substitui a revisão científica e pedagógica do professor.' };
  }

  /* ---------- exportação ---------- */
  function toMarkdown(m) {
    m = normalize(m);
    const o = ['# ' + m.title, '', '**Disciplina:** ' + m.discipline + '  ', '**Etapa:** ' + m.level + '  ', '**Duração:** ' + m.duration, ''];
    if (m.objectives.length) o.push('## Objetivos de aprendizagem', '', ...m.objectives.map((x) => '- ' + x), '');
    if (m.prerequisites.length) o.push('## Conhecimentos prévios', '', ...m.prerequisites.map((x) => '- ' + x), '');
    m.blocks.forEach((b) => { o.push('## ' + b.title, '', b.content, ''); if (b.callout) o.push('> **' + CALLOUTS[b.callout.kind][0] + '** ' + b.callout.text, ''); if (b.svg) o.push('*[Figura SVG: exporte o arquivo .svg deste recurso]*', ''); });
    if (m.poster) {
      o.push('## Apostila visual', '', '**' + m.poster.title + '** — ' + m.poster.subtitle, '');
      m.poster.sections.forEach((s, i) => o.push((i + 1) + '. **' + s.label + '** — ' + s.text));
      if (m.poster.goldTip) o.push('', '💡 **Dica de ouro:** ' + m.poster.goldTip);
      if (m.poster.didYouKnow) o.push('', '**Você sabia?** ' + m.poster.didYouKnow);
      if (m.poster.attention) o.push('', '⚠️ **Atenção:** ' + m.poster.attention);
      o.push('');
    }
    if (m.references.length) o.push('## Referências', '', ...m.references.map((r) => '- ' + r.authors + ' (' + r.year + '). ' + r.title + '. ' + r.venue + (r.doi ? ' DOI: ' + r.doi : '') + (r.url ? ' ' + r.url : '') + ' [acesso: ' + r.accessLevel + ']'), '');
    if (m.limitations.length) o.push('## Limitações', '', ...m.limitations.map((x) => '- ' + x), '');
    return o.join('\n');
  }

  const DOC_CSS = [
    'body{font-family:"Segoe UI",Arial,sans-serif;color:#1d2433;line-height:1.55;margin:0;background:#eef1f7}',
    '.doc{max-width:820px;margin:0 auto;background:#fff;padding:36px 44px}',
    '.doc h1{color:#14264f;border-bottom:4px solid #f2b705;padding-bottom:8px;margin-top:0}',
    '.meta{color:#55607a;font-size:.92em;margin-bottom:18px}',
    '.sec{border-left:6px solid #14264f;background:#f7f9fd;border-radius:0 10px 10px 0;padding:6px 18px 10px;margin:18px 0;page-break-inside:avoid}',
    '.sec>h2{margin:.5em 0 .3em;font-size:1.2em;color:#14264f}',
    '.b-exemplo{border-color:#22a559;background:#f1faf4}.b-atividade{border-color:#f28a1f;background:#fff7ee}.b-exercicios{border-color:#7a4bd1;background:#f7f3ff}',
    '.b-gabarito{border-color:#1e6fd9;background:#eef5ff}.b-nota{border-color:#d6453d;background:#fff3f2}.b-acessibilidade{border-color:#0e8f8f;background:#effafa}.b-problematizacao{border-color:#f2b705;background:#fffbea}',
    '.math{font-family:Cambria,"Times New Roman",serif;font-style:italic;background:#fff8d6;padding:0 3px;border-radius:3px}',
    '.fig{text-align:center;margin:10px 0}.fig svg{max-width:100%;height:auto}',
    'table{border-collapse:collapse;margin:8px 0}th,td{border:1px solid #b9c3d9;padding:4px 10px}th{background:#e8edf8}',
    'blockquote{border-left:4px solid #f2b705;margin:8px 0;padding:2px 12px;color:#44506b}',
    '.refs li,.lims li{margin:3px 0}',
    '@page{size:A4;margin:14mm}',
    '@media print{body{background:#fff}.doc{max-width:none;padding:0}.pgbreak{page-break-after:always}}',
  ].join('\n');

  function toHTML(m, o) {
    m = normalize(m); o = o || {};
    const body = [];
    if (m.poster && o.poster !== false) body.push('<div class="pgbreak">' + renderPoster(m.poster, m.author) + '</div>');
    if (o.material !== false) {
      body.push('<div class="doc"><h1>' + esc(m.title) + '</h1><div class="meta">' + [m.discipline, m.level, m.duration, m.author].filter(Boolean).map(esc).join(' · ') + '</div>');
      if (m.objectives.length) body.push('<div class="sec b-conceito"><h2>🎯 Objetivos de aprendizagem</h2><ul>' + m.objectives.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul></div>');
      if (m.prerequisites.length) body.push('<div class="sec"><h2>🔑 Conhecimentos prévios</h2><ul>' + m.prerequisites.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul></div>');
      m.blocks.forEach((b) => {
        body.push('<section class="sec b-' + b.type + '"><h2>' + BLOCK_TYPES[b.type][1] + ' ' + esc(b.title) + '</h2>' + renderMarkdown(b.content) +
          (b.svg ? '<div class="fig">' + sanitizeSvg(b.svg) + '</div>' : '') + '</section>');
      });
      if (m.references.length) body.push('<div class="sec"><h2>📚 Referências</h2><ul class="refs">' + m.references.map((r) => '<li>' + esc(r.authors) + ' (' + esc(r.year) + '). <em>' + esc(r.title) + '</em>. ' + esc(r.venue) + (r.doi ? ' DOI: ' + esc(r.doi) : '') + ' <small>[acesso: ' + esc(r.accessLevel) + ']</small></li>').join('') + '</ul></div>');
      if (m.limitations.length) body.push('<div class="sec b-nota"><h2>⚠️ Limitações documentais</h2><ul class="lims">' + m.limitations.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul></div>');
      body.push('</div>');

  const BLOCK_COLOR = { problematizacao: 3, contexto: 1, conceito: 1, exemplo: 2, visual: 1, atividade: 3, exercicios: 5, gabarito: 2, avaliacao: 4, acessibilidade: 5, nota: 4 };

  function blockWeight(b) {

  const BOOK_SCRIPT = "<script>(function(){\nvar H=1123,pages=function(){return Array.prototype.slice.call(document.querySelectorAll('.mlpage:not(.mlcover)'));};\nfunction mk(src){var d=document.createElement('div');d.className='mlpage';d.setAttribute('data-kind','content');var h=src.querySelector('.mlph'),f=src.querySelector('.mlpf');if(h)d.appendChild(h.cloneNode(true));if(f)d.appendChild(f.cloneNode(true));return d;}\nfunction kids(p){return Array.prototype.filter.call(p.children,function(c){return c.classList.contains('mlmove');});}\nfunction over(p){return p.scrollHeight>H+1;}\nfunction run(){\n var list=pages();\n for(var i=0;i<list.length;i++){\n  var p=list[i];\n  var guard=0;\n  while(over(p)&&kids(p).length>1&&guard++<60){\n   var k=kids(p),last=k[k.length-1];\n   var nx=p.nextElementSibling;\n   if(!nx||!nx.classList.contains('mlpage')||nx.getAttribute('data-kind')==='final'||p.getAttribute('data-kind')==='final'||!nx.classList.contains('mlpage')||nx.getAttribute('data-moved')!=='1'){\n    nx=mk(p);nx.setAttribute('data-moved','1');p.parentNode.insertBefore(nx,p.nextSibling);list.splice(i+1,0,nx);\n   }\n   var first=nx.querySelector('.mlmove');\n   if(first)nx.insertBefore(last,first);else nx.insertBefore(last,nx.querySelector('.mlpf'));\n  }\n }\n var all=pages(),off=document.querySelectorAll('.mlcover').length,tot=all.length+off;\n var toc=[];\n all.forEach(function(p,i){\n  var f=p.querySelectorAll('.mlpf span');if(f.length)f[f.length-1].textContent=(i+1+off)+' / '+tot;\n  var pg=p.querySelector('.mlph-pg');if(pg)pg.textContent=(i+1+off);\n  Array.prototype.forEach.call(p.querySelectorAll('.mlc[data-n]'),function(c){if(c.getAttribute('data-n'))toc.push('<li><b>'+c.getAttribute('data-n')+'.</b> '+c.getAttribute('data-t')+'<i></i><b>pág. '+(i+1+off)+'</b></li>');});\n });\n var ul=document.querySelector('.mltoc');if(ul&&toc.length)ul.innerHTML=toc.join('');\n}\nif(document.readyState==='complete')run();else window.addEventListener('load',run);\n})();<\/script>";

  function toApostila(m, o) {
    m = normalize(m); o = o || {};
    const theme = (m.poster && m.poster.theme) || 'alegre';
    const isEd = !m.poster || m.poster.interiorStyle !== 'ludico';

      : '<div class="mlph"><div class="mlph-left">' + (lg || MASCOT_SVG) + '<div><b>' + esc(m.title) + '</b><small>' + [m.discipline, m.level].filter(Boolean).map(esc).join(' · ') + '</small></div></div><span class="mlph-badge">' + esc(m.author || DEFAULT_AUTHOR) + '</span></div>';
    const card = (n, icon, label, inner, c, ttl, ped) => '<section class="mlc mlmove" data-n="' + (typeof n === 'number' ? n : '') + '" data-t="' + esc(ttl || '') + '" style="--c:var(--c' + c + ')"><div class="mlc-tag"><span class="mlc-num">' + n + '</span>' + (isEd ? '' : icon + ' ') + esc(label) + '</div>' + (ped ? '<div class="mlc-ped">' + esc(ped) + '</div>' : '') + inner + '</section>';

    let intro = '<div id="ml-toc"></div>@@HEAD@@<h2 class="mlh2">Antes de começar</h2><p class="mlsub-hand">Percurso de mediação — dos conhecimentos cotidianos aos científicos</p><div class="mlinfo">' +
      [m.discipline, m.level, m.duration && '⏱️ ' + m.duration, '📘 ' + profLabel, '🧠 Psicologia Histórico-Cultural'].filter(Boolean).map((x) => '<span>' + esc(x) + '</span>').join('') + '</div>';
    if (isEd) intro += '<div class="mled-guide mlmove"><div class="mled-guide-av">' + av + '</div><div>@@TOC@@</div></div>';
    if (m.poster && m.poster.videoUrl && /^https?:\/\//i.test(m.poster.videoUrl)) {
      intro += '<a class="mlvid mlmove" href="' + esc(m.poster.videoUrl) + '" target="_blank" rel="noopener"><div><strong>▶ Videoaula complementar</strong><span>' + esc(m.poster.videoTitle || m.title) + '</span></div><span>Abrir ↗</span></a>';
    }
    if (m.prerequisites.length) intro += card('🔑', '', 'O que você já traz (Conceitos cotidianos)', '<ul>' + m.prerequisites.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul>', 2);
    if (m.objectives.length) intro += card('🎯', '', 'Para onde vamos juntos (Objetivos na ZDP)', '<ul>' + m.objectives.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul>', 1);
    if (!isEd) intro += '<div class="mlmove mltocwrap">@@TOC@@</div>';

      '<div class="mlsynth-q">2. A ideia científica principal que aprendi hoje:</div><div class="mlsynth-line"></div>' +
      '<div class="mlsynth-q">3. Uma dúvida ou exemplo próprio para discutir em aula:</div><div class="mlsynth-line"></div></div>';
    if (m.references.length) fin += card('📚', '', 'Referências', '<ul class="mlrefs">' + m.references.map((r) => '<li>' + esc(r.authors) + ' (' + esc(r.year) + '). <em>' + esc(r.title) + '</em>. ' + esc(r.venue) + (r.doi ? ' DOI: ' + esc(r.doi) : '') + ' <small>[acesso: ' + esc(r.accessLevel) + ']</small></li>').join('') + '</ul>', 3);
    if (m.limitations.length) fin += card('⚠️', '', 'Sobre este material', '<ul>' + m.limitations.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul>', 4);
    fin += '<div class="mlauthor-box mlmove">' + (m.poster && m.poster.avatarChoice !== 'svg' ? av : '') + '<div><strong>' + esc(m.author || DEFAULT_AUTHOR) + '</strong><br><small>MathLab Educação · Matemática em Investigação. Material didático fundamentado na Psicologia Histórico-Cultural e validado pelo docente.</small></div></div>';
    fin += '<div class="mlcolophon mlmove" id="ml-colophon"><div><b>Título:</b> ' + esc(m.title) + '</div><div><b>Autoria:</b> ' + esc(m.author || DEFAULT_AUTHOR) + '</div><div><b>Perfil:</b> ' + esc(profLabel) + '</div><div><b>Estilo do miolo:</b> ' + (isEd ? 'Editorial Clean' : 'Lúdico / HQ') + '</div><div><b>Tipografia:</b> Fredoka · Caveat · Nunito</div><div><b>Formato:</b> A4 · Versão ' + VERSION + '</div></div>';
    fin += '<p class="mlnote mlmove">Este material deve ser conferido e validado pelo professor antes do uso em aula.</p>';

    /* numeração das páginas: Capa Clean (1) + Folha de Rosto/Pôster (2) + Miolo */
    const hasPoster = !!(m.poster && o.cover !== false);
    const hasCleanCover = !!(hasPoster && m.poster.coverClean !== false && o.cleanCover !== false);
    const coverCount = (hasCleanCover ? 1 : 0) + (hasPoster ? 1 : 0);
    const first = coverCount + 1;
    const total = pages.length + coverCount;
    const toc = [];
    pages.forEach((p, i) => { p.pn = first + i; if (p.items) p.items.forEach((it) => toc.push('<li><b>' + it.n + '.</b> ' + esc(it.title) + '<i></i><b>pág. ' + p.pn + '</b></li>')); });
    const tocHtml = toc.length ? '<h2 class="mlh2" style="margin-top:4px;font-size:22px">Nesta apostila</h2><ul class="mltoc">' + toc.join('') + '</ul>' : '';

        '<div class="card"><details><summary>Histórico do projeto</summary>' + p.log.slice().reverse().slice(0, 40).map((l) => '<div class="muted">' + fmt(l.at) + ' — ' + esc(l.msg) + '</div>').join('') + '</details></div>';

      '<div class="list-item"><div><b>' + esc(x.name) + '</b> ' + (x.archived ? '<span class="pill">arquivado</span>' : '') + '<br><span class="muted">' + esc([x.discipline, x.level].filter(Boolean).join(' · ')) + ' · ' + x.materials.length + ' material(is)</span></div><div class="btns"><button class="b sm" data-a="openproj" data-id="' + x.id + '">Abrir</button></div></div>').join('')
      : '<p class="muted">Nenhum projeto ainda. Crie o primeiro abaixo ou carregue o exemplo.</p>') +
      '<label><input type="checkbox" data-a="toggleArch" ' + (S.showArch ? 'checked' : '') + ' style="width:auto"> mostrar arquivados</label></div>' +
      '<div class="card"><h3>Novo projeto</h3><div class="row"><div><label>Nome</label><input id="np-name" placeholder="Ex.: 7º ano — Matemática"></div><div><label>Disciplina</label><input id="np-disc" placeholder="Ex.: Matemática"></div><div><label>Etapa de ensino</label><input id="np-level" placeholder="Ex.: 7º ano do Ensino Fundamental"></div></div><div class="btns"><button class="b gold" data-a="newproj">Criar projeto</button><button class="b ghost" data-a="demo">Carregar exemplo completo</button></div></div>' +
      '<div class="card"><h3>Backup</h3><p class="muted">Seus dados ficam só neste navegador. Baixe um backup de vez em quando.</p><div class="btns"><button class="b ghost" data-a="backup">Baixar backup da biblioteca</button><label class="b ghost" style="display:inline-block;margin:0;cursor:pointer">Restaurar backup<input type="file" accept=".json,application/json" data-a="restore" style="display:none"></label></div></div>';

  /* ---------- Criar ---------- */
  function vCriar() {

    return '<div class="card"><h2>Criar material</h2><p class="muted">Funciona para qualquer disciplina, fundamentado na Psicologia Histórico-Cultural. Sem limite fixo de páginas e com escolha modular das seções.</p>' +
      '<div class="row"><div><label>Autor</label><input data-form="author" value="' + esc(f.author) + '" placeholder="Prof. Alê Barbosa"></div><div><label>Disciplina</label><input data-form="discipline" value="' + esc(f.discipline) + '" placeholder="Ex.: História"></div><div><label>Etapa de ensino</label><input data-form="level" value="' + esc(f.level) + '" placeholder="Ex.: 8º ano"></div><div><label>Tema</label><input data-form="topic" value="' + esc(f.topic) + '" placeholder="Ex.: Revolução Francesa"></div><div><label>Duração</label><input data-form="duration" value="' + esc(f.duration) + '"></div></div>' +
      '<div class="row"><div><label>Tipo de conhecimento</label><select data-form="type">' + opt('auto', 'Detectar pela disciplina', f.type === 'auto') + Object.keys(C.EPISTEMIC).map((k) => opt(k, C.EPISTEMIC[k].label, f.type === k)).join('') + '</select></div>' +
      '<div><label>O que você quer incluir?</label><select data-form="contentProfile">' + Object.keys(C.CONTENT_PROFILES).map((k) => opt(k, C.CONTENT_PROFILES[k], f.contentProfile === k)).join('') + '</select></div>' +
      '<div><label>Salvar no projeto</label><select data-form="target">' + opt('', '(criar projeto novo)', !f.target) + lib.projects.filter((p) => !p.archived).map((p) => opt(p.id, p.name, f.target === p.id)).join('') + '</select></div></div>' +
      '<label>Objetivos desejados (opcional)</label><textarea data-form="objectives" rows="2">' + esc(f.objectives) + '</textarea></div>' +
      '<div class="card steps"><h3>Caminho sem custo (recomendado)</h3>' +
      '<div class="step"><b>Copie o pedido</b> e cole no seu Gem do Gemini (ou no Claude com a skill instalada).<div class="btns"><button class="b gold" data-a="copyreq">Copiar pedido</button></div></div>' +
      '<div class="step"><b>Cole aqui o JSON</b> que ele devolveu e importe.<textarea data-form="pasted" rows="6" placeholder="Cole aqui o bloco JSON inteiro…">' + esc(f.pasted) + '</textarea><div class="btns"><button class="b" data-a="importjson">Importar material</button></div></div>' +

  }

  /* ---------- Editor ---------- */
  function vEditor() {
    const d = S.draft, rec = mat();
    const bc = { exemplo: '#22a559', atividade: '#f28a1f', exercicios: '#7a4bd1', gabarito: '#1e6fd9', nota: '#d6453d', acessibilidade: '#0e8f8f', problematizacao: '#f2b705' };
    let h = '<div class="card"><div class="btns" style="justify-content:space-between"><h2 style="margin:0">' + esc(d.title) + ' ' + (S.dirty ? '<span class="dirty" id="dirtymark">● alterações não salvas</span>' : '<span class="pill ok" id="dirtymark">salvo</span>') + '</h2>' +
      '<div class="btns"><button class="b gold" data-a="save">💾 Salvar nova versão</button><button class="b ghost" data-a="prev">👁️ Prévia</button><button class="b ghost" data-a="vers">🕘 Versões (' + (rec ? rec.versions.length : 0) + ')</button></div></div>';
    if (S.showPrev) h += '<iframe class="pv" sandbox="" srcdoc="' + esc(C.toHTML(d)) + '"></iframe>';
    if (S.showVers && rec) h += '<h3>Versões</h3>' + rec.versions.slice().reverse().map((v, i) => '<div class="list-item"><div>' + fmt(v.at) + ' — ' + esc(v.note || '') + ' ' + (v.vid === rec.cur ? '<span class="pill ok">atual</span>' : '') + ' ' + lvlPill(v.audit.level) + ' <span class="muted">nota ' + v.audit.score + '</span></div>' + (v.vid === rec.cur ? '' : '<button class="b ghost sm" data-a="restorever" data-v="' + v.vid + '">Restaurar como nova versão</button>') + '</div>').join('');
    h += '</div>';
    h += '<div class="card"><h3>Identificação</h3><div class="row"><div>' + inp('title', 'Título') + '</div><div>' + inp('author', 'Autor') + '</div><div>' + inp('discipline', 'Disciplina') + '</div><div>' + inp('level', 'Etapa de ensino') + '</div><div>' + inp('topic', 'Tema') + '</div><div>' + inp('duration', 'Duração') + '</div>' +
      '<div><label>Tipo de conhecimento</label><select data-f="epistemicType">' + Object.keys(C.EPISTEMIC).map((k) => '<option value="' + k + '"' + (d.epistemicType === k ? ' selected' : '') + '>' + esc(C.EPISTEMIC[k].label) + '</option>').join('') + '</select></div>' +
      '<div><label>Perfil do material</label><select data-f="contentProfile">' + Object.keys(C.CONTENT_PROFILES).map((k) => '<option value="' + k + '"' + (d.contentProfile === k ? ' selected' : '') + '>' + esc(C.CONTENT_PROFILES[k]) + '</option>').join('') + '</select></div></div>' +
      area('objectives', 'Objetivos de aprendizagem (um por linha)', 4, true) + area('prerequisites', 'Conhecimentos prévios (um por linha)', 3, true) + '</div>';
    h += '<div class="card"><h3>Blocos do material</h3>' + d.blocks.map((b, i) =>
      '<div class="blk" style="border-left-color:' + (bc[b.type] || '#14264f') + '"><div class="head"><div><label>Tipo</label><select data-f="blocks.' + i + '.type">' + Object.keys(C.BLOCK_TYPES).map((k) => '<option value="' + k + '"' + (b.type === k ? ' selected' : '') + '>' + C.BLOCK_TYPES[k][1] + ' ' + C.BLOCK_TYPES[k][0] + '</option>').join('') + '</select></div><div>' + inp('blocks.' + i + '.title', 'Título do bloco') + '</div>' +
      '<div class="btns"><button class="b ghost sm" data-a="bup" data-i="' + i + '" title="Subir">↑</button><button class="b ghost sm" data-a="bdn" data-i="' + i + '" title="Descer">↓</button><button class="b danger sm" data-a="bdel" data-i="' + i + '" title="Remover">✕</button></div></div>' +
      area('blocks.' + i + '.content', 'Conteúdo (Markdown simples: # título, **negrito**, listas, tabelas, $fórmula$)', 7) +
      '<details' + (b.svg ? ' open' : '') + '><summary>Figura SVG ' + (b.svg ? '(com figura)' : '(sem figura)') + '</summary><textarea rows="4" data-f="blocks.' + i + '.svg" placeholder="Cole aqui um SVG ou use “Inserir figura” abaixo">' + esc(b.svg) + '</textarea>' + (b.svg ? '<div class="preview">' + C.sanitizeSvg(b.svg) + '</div>' : '') + '</details></div>').join('') +
      '<div class="btns"><select id="newtype" style="width:auto">' + Object.keys(C.BLOCK_TYPES).map((k) => '<option value="' + k + '">' + C.BLOCK_TYPES[k][0] + '</option>').join('') + '</select><button class="b" data-a="addblock">+ Adicionar bloco</button></div></div>';
    h += '<div class="card"><h3>Inserir figura (gerada offline)</h3><div class="row"><div><label>Tipo de figura</label><select data-vis="kind">' + [['numberLine', 'Reta numérica'], ['timeline', 'Linha do tempo'], ['flow', 'Fluxograma'], ['conceptMap', 'Mapa conceitual']].map((x) => '<option value="' + x[0] + '"' + (S.vis.kind === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></div><div><label>Título da figura</label><input data-vis="title" value="' + esc(S.vis.title) + '"></div></div>' +
      '<label>Dados</label><textarea data-vis="text" rows="4">' + esc(S.vis.text) + '</textarea><p class="muted" id="vishelp">' + visHelp(S.vis.kind) + '</p><div class="btns"><button class="b" data-a="addvis">+ Inserir como bloco visual</button></div></div>';
    h += '<div class="card"><h3>Referências</h3><p class="muted">Nunca invente referências. Marque o nível de acesso real: só "integral" se leu a obra inteira.</p>' + d.references.map((r, i) =>
      '<div class="blk"><div class="row"><div>' + inp('references.' + i + '.authors', 'Autor(es)') + '</div><div>' + inp('references.' + i + '.title', 'Título') + '</div><div>' + inp('references.' + i + '.year', 'Ano') + '</div><div>' + inp('references.' + i + '.venue', 'Periódico/editora') + '</div><div>' + inp('references.' + i + '.doi', 'DOI') + '</div><div>' + inp('references.' + i + '.url', 'URL') + '</div>' +
      '<div><label>Nível de acesso</label><select data-f="references.' + i + '.accessLevel">' + ['integral', 'parcial', 'resumo', 'metadados', 'localizada', 'nao-verificado'].map((k) => '<option' + (r.accessLevel === k ? ' selected' : '') + '>' + k + '</option>').join('') + '</select></div><div><label><input type="checkbox" style="width:auto" data-f="references.' + i + '.verified"' + (r.verified ? ' checked' : '') + '> verificada por mim</label></div></div><div class="btns"><button class="b danger sm" data-a="delref" data-i="' + i + '">Remover referência</button></div></div>').join('') +
      '<div class="btns"><button class="b ghost" data-a="addref">+ Adicionar referência</button></div>' + area('limitations', 'Limitações documentais (uma por linha)', 3, true) + '</div>';
    return h;
  }
  function visHelp(k) {
    return { numberLine: 'Formato: mínimo, máximo, saltoDe, saltoPor. Ex.: -6, 6, -2, 5 (deixe só "-6, 6" para reta sem salto).', timeline: 'Uma linha por evento: ano | descrição. Ex.: 1789 | Revolução Francesa', flow: 'Uma etapa por linha.', conceptMap: 'Primeira linha: tema central. Demais linhas: conceitos ligados a ele.' }[k];
  }
  function buildVis() {
    const t = S.vis.text.split('\n').map((x) => x.trim()).filter(Boolean), title = S.vis.title.trim();
    if (S.vis.kind === 'numberLine') { const n = (t[0] || '').split(/[,;\s]+/).map(Number); if (n.length < 2 || n.some(isNaN) || n[1] <= n[0]) return null; return C.VISUALS.numberLine({ min: n[0], max: n[1], jump: n.length >= 4 ? { from: n[2], by: n[3] } : null, title }); }
    if (S.vis.kind === 'timeline') { const ev = t.map((l) => { const [a, ...b] = l.split('|'); return { when: (a || '').trim(), label: b.join('|').trim() }; }).filter((e) => e.when && e.label); return ev.length >= 2 ? C.VISUALS.timeline({ events: ev, title }) : null; }
    if (S.vis.kind === 'flow') return t.length >= 2 ? C.VISUALS.flow({ steps: t, title }) : null;
    return t.length >= 3 ? C.VISUALS.conceptMap({ center: t[0], nodes: t.slice(1), title }) : null;
  }

  /* ---------- Apostila visual ---------- */
  function vPoster() {
    const d = S.draft, p = d.poster;
    if (!p) return '<div class="card empty"><h2>Este material ainda não tem apostila visual</h2><p>A apostila visual é o pôster de uma página com caixas numeradas, dicas e resumo.</p><button class="b gold" data-a="mkposter">Criar apostila visual</button></div>';
    const L = C.EPISTEMIC[d.epistemicType].labels;
    return '<div class="two"><div class="card"><h2>Capa Clean & Folha de Rosto</h2><p class="muted">A Capa Clean abre a apostila (título, subtítulo, logo, avatar e autor); a Folha de Rosto traz o mapa visual com caixas curtas (até 25 palavras).</p>' +
      '<label><input type="checkbox" style="width:auto" data-f="poster.coverClean"' + (p.coverClean !== false ? ' checked' : '') + '> Incluir Capa Clean (Página 1) antes da Folha de Rosto</label>' +
      '<label>Avatar do Prof. Alê / Mascote</label><select data-f="poster.avatarChoice">' + Object.keys(C.AVATAR_OPTIONS).map((k) => '<option value="' + k + '"' + ((p.avatarChoice || 'avatar-prof-ale-1.jpg') === k ? ' selected' : '') + '>' + esc(C.AVATAR_OPTIONS[k]) + '</option>').join('') + '</select>' +
      '<label>Logo MathLab</label><select data-f="poster.logoChoice">' + Object.keys(C.LOGO_OPTIONS).map((k) => '<option value="' + k + '"' + ((p.logoChoice || 'logo-mathlab-clean.jpg') === k ? ' selected' : '') + '>' + esc(C.LOGO_OPTIONS[k]) + '</option>').join('') + '</select>' +
      '<label>Tema de cores</label><select data-f="poster.theme">' + Object.keys(C.POSTER_THEMES).map((k) => '<option value="' + k + '"' + (p.theme === k ? ' selected' : '') + '>' + esc(C.POSTER_THEMES[k].nome) + '</option>').join('') + '</select>' +
      inp('poster.title', 'Título do pôster') + inp('poster.subtitle', 'Subtítulo') + inp('poster.author', 'Autor na capa', C.DEFAULT_AUTHOR) + inp('poster.videoTitle', 'Videoaula complementar (título opcional)', 'Ex.: Aula em vídeo — Prof. Alê') + inp('poster.videoUrl', 'Link da videoaula (opcional)', 'https://youtube.com/...') + inp('poster.mascot', 'Mascote (descrição para a IA de imagem)', 'Ex.: estudante sorridente de mochila azul') +
      '<h3>Caixas numeradas</h3>' + p.sections.map((s, i) => '<div class="blk"><div class="row"><div>' + inp('poster.sections.' + i + '.label', 'Rótulo ' + (i + 1), L[i] || '') + '</div><div>' + inp('poster.sections.' + i + '.title', 'Subtítulo (opcional)') + '</div></div>' + area('poster.sections.' + i + '.text', 'Texto', 3) + '<button class="b danger sm" data-a="delsec" data-i="' + i + '">Remover caixa</button></div>').join('') +
      (p.sections.length < 6 ? '<div class="btns"><button class="b ghost" data-a="addsec">+ Caixa numerada</button></div>' : '') +
      '<h3>Caixas extras</h3>' + inp('poster.goldTip', '💡 Dica de ouro') + inp('poster.didYouKnow', 'Você sabia?') + inp('poster.attention', '⚠️ Atenção aos detalhes') +
      '<h3>Faixa “Em resumo”</h3>' + p.summary.map((s, i) => '<div class="row"><div>' + inp('poster.summary.' + i + '.icon', 'Ícone (emoji)') + '</div><div>' + inp('poster.summary.' + i + '.label', 'Rótulo') + '</div><div>' + inp('poster.summary.' + i + '.text', 'Texto') + '</div><div><label>&nbsp;</label><button class="b danger sm" data-a="delsum" data-i="' + i + '">✕</button></div></div>').join('') +
      (p.summary.length < 5 ? '<div class="btns"><button class="b ghost" data-a="addsum">+ Item</button></div>' : '') + '</div>' +
      '<div><div class="card"><h3>Prévia (Capa Clean + Folha de Rosto)</h3><div id="posterPreview" class="preview">' + (p.coverClean !== false ? '<div style="margin-bottom:16px">' + C.renderCleanCover(d) + '</div>' : '') + C.renderPoster(p, d.author) + '</div></div>' +
      '<div class="card"><h3>Versão ilustrada com IA</h3><p class="muted">Copie o prompt, abra o Gemini (Nano Banana) e cole. O formato da imagem você escolhe no próprio app. IA de imagem às vezes erra letras: confira o texto na imagem. O pôster em HTML ao lado é sempre a versão exata.</p><div class="btns"><button class="b gold" data-a="copyimg">Copiar prompt da imagem</button><button class="b ghost" data-a="dlposter">Baixar pôster (HTML)</button><button class="b ghost" data-a="printposter">Imprimir / PDF</button></div><details><summary>Ver o prompt</summary><pre class="code">' + esc(C.buildImagePrompt(d)) + '</pre></details></div></div></div>';

  /* ---------- Auditoria ---------- */
  function vAud() {

      (a.hard.length ? '<div class="card" style="border-color:var(--bad)"><h3 style="color:var(--bad)">Falhas graves (' + a.hard.length + ')</h3>' + a.hard.map((x) => '<div class="find hard">⛔ <b>' + esc(x.cat) + ':</b> ' + esc(x.msg) + '</div>').join('') + '</div>' : '') +

  /* ---------- Exportar ---------- */
  function vExp() {

    return '<div class="card"><h2>Exportar</h2><p class="muted">Exporta o que está no Editor agora (mesmo sem salvar).</p><div class="btns"><button class="b gold" data-a="dlbook">📘 Apostila completa (capa + miolo)</button><button class="b" data-a="printbook">🖨️ Imprimir apostila / salvar PDF</button><button class="b ghost" data-a="dlhtml">📄 Material em HTML simples</button><button class="b ghost" data-a="printall">🖨️ Imprimir material simples</button><button class="b ghost" data-a="dlposter">🖼️ Só o pôster (HTML)</button><button class="b ghost" data-a="dlmd">Markdown</button><button class="b ghost" data-a="dljson">JSON (para reimportar)</button></div>' +
      (svgs.length ? '<h3>Figuras SVG</h3><div class="btns">' + svgs.map((x) => '<button class="b ghost sm" data-a="dlsvg" data-i="' + x[1] + '">' + esc(x[0].title) + '.svg</button>').join('') + '</div>' : '') +
      '<p class="muted">Para PDF: use “Imprimir / salvar PDF” e escolha “Salvar como PDF” no navegador. Word e PowerPoint ainda não estão nesta versão.</p></div>';
  }

  /* ---------- Ajuda ---------- */
  function vAjuda() {
    return '<div class="card steps"><h2>Como usar</h2>' +
      '<div class="step"><b>Gemini Pro (Gem):</b> em gemini.google.com, abra “Gems” → “Novo Gem”, cole o texto do arquivo <code>gemini/GEM_INSTRUCOES.md</code> nas instruções e salve com o nome “MathLab”.</div>' +
      '<div class="step"><b>Claude:</b> instale a skill <code>mathlab-aulas-visuais</code> (arquivo <code>skill/SKILL.md</code>).</div>' +
      '<div class="step">Aqui em <b>Criar</b>: preencha o pedido, copie, cole no Gem, copie o JSON que ele devolver e importe.</div>' +
      '<div class="step">Em <b>Apostila visual</b>: copie o prompt e gere a imagem ilustrada no Nano Banana (Gemini). O pôster em HTML já fica pronto para imprimir.</div>' +
      '<div class="step"><b>Publicar no GitHub Pages:</b> suba esta pasta num repositório, em Settings → Pages escolha “GitHub Actions”. O arquivo <code>.github/workflows/pages.yml</code> já está pronto.</div>' +
      '<div class="btns"><a class="b ghost" href="dist/mathlab-standalone.html" download="mathlab-standalone.html" style="text-decoration:none">⬇️ Baixar versão offline (arquivo único)</a></div></div>' +
      '<div class="card"><h3>Limites desta versão</h3><ul><li>Não escreve conteúdo sozinho: a IA vem da skill/Gem.</li><li>Exporta HTML, PDF (pelo navegador), Markdown, JSON e SVG. Word e PowerPoint ficam para a próxima etapa.</li><li>Dados ficam só neste navegador: faça backup na Biblioteca.</li></ul></div>';
  }

  /* ---------- ações ---------- */
  const A = {
    tab: (el) => { S.tab = el.dataset.t; render(); },
    openproj: (el) => { S.pid = el.dataset.id; render(); },
    closeproj: () => { S.pid = null; render(); },
    toggleArch: (el) => { S.showArch = el.checked; render(); },
    newproj: () => { const p = newProject($('#np-name').value.trim(), $('#np-disc').value.trim(), $('#np-level').value.trim()); persist(); S.pid = p.id; render(); },
    dupproj: (el) => {
      const p = proj(el.dataset.id), c = C.clone(p); c.id = C.uid('p'); c.name += ' (cópia)'; c.materials.forEach((r) => { r.id = C.uid('m'); }); logp(c, 'Duplicado de "' + p.name + '"');
      lib.projects.unshift(c); persist(); S.pid = c.id; render(); toast('Projeto duplicado.');
    },
    arch: (el) => { const p = proj(el.dataset.id); p.archived = !p.archived; logp(p, p.archived ? 'Arquivado' : 'Desarquivado'); persist(); S.pid = null; render(); },
    delproj: (el) => {
      const p = proj(el.dataset.id);
      if (!confirm('Excluir o projeto "' + p.name + '" e seus ' + p.materials.length + ' material(is)? Um backup dele será baixado antes.')) return;
      const t = prompt('Para confirmar, digite o nome do projeto:\n' + p.name); if (t !== p.name) { toast('Nome diferente. Nada foi excluído.', true); return; }
      dl('backup-' + slug(p.name) + '.json', 'application/json', JSON.stringify({ app: 'mathlab', version: 2, projects: [p] }, null, 2));
      lib.projects = lib.projects.filter((x) => x !== p); if (S.pid === p.id) { S.pid = null; S.mid = null; S.draft = null; S.dirty = false; } persist(); render();
    },
    openmat: (el) => openMat(el.dataset.p, el.dataset.m),
    dupmat: (el) => { const p = proj(), r = p.materials.find((x) => x.id === el.dataset.m), c = C.clone(r); c.id = C.uid('m'); const d = curData(c); d.title += ' (cópia)'; p.materials.unshift(c); logp(p, 'Material duplicado'); persist(); render(); },
    delmat: (el) => { const p = proj(), r = p.materials.find((x) => x.id === el.dataset.m); if (!confirm('Excluir "' + curData(r).title + '" com todas as versões? Isso não pode ser desfeito.')) return; p.materials = p.materials.filter((x) => x !== r); if (S.mid === r.id) { S.draft = null; S.mid = null; S.dirty = false; } logp(p, 'Material excluído'); persist(); render(); },
    backup: () => dl('mathlab-backup-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json', JSON.stringify({ app: 'mathlab', version: 2, projects: lib.projects }, null, 2)),
    restore: (el) => {
      const f = el.files[0]; if (!f) return;
      const rd = new FileReader(); rd.onload = () => {
        try { const j = JSON.parse(rd.result); if (!Array.isArray(j.projects)) throw new Error('arquivo sem projetos'); let n = 0; j.projects.forEach((p) => { if (!lib.projects.some((x) => x.id === p.id)) { lib.projects.push(p); n++; } }); persist(); render(); toast(n + ' projeto(s) restaurado(s); os que já existiam foram mantidos.'); }
        catch (e) { toast('Backup inválido: ' + e.message, true); }
      }; rd.readAsText(f);
    },
    copyreq: async () => { const t = C.buildRequestText(S.form); toast((await copy(t)) ? 'Pedido copiado. Cole no seu Gem ou no Claude.' : 'Não consegui copiar automaticamente.', false); },
    importjson: () => {
      const r = C.importFromText(S.form.pasted); if (!r.ok) { toast(r.error, true); return; }
      const m = r.material; const p = (S.form.target && proj(S.form.target)) || newProject(m.discipline || m.title, m.discipline, m.level);
      const rec = addMaterial(p, m, 'Importado da skill'); toast('Material importado.' + (r.warnings.length ? ' ' + r.warnings.join(' ') : '')); S.form.pasted = ''; openMat(p.id, rec.id);
    },
    scaffold: () => {
      if (!S.form.topic.trim()) { toast('Preencha ao menos o tema.', true); return; }
      const m = C.scaffold(S.form); const p = (S.form.target && proj(S.form.target)) || newProject(m.discipline || m.title, m.discipline, m.level);
      const rec = addMaterial(p, m, 'Esqueleto offline'); openMat(p.id, rec.id);
    },
    demo: () => { let p = lib.projects.find((x) => x.name === 'Exemplos'); if (!p) { p = newProject('Exemplos', 'Matemática', '7º ano'); } const rec = addMaterial(p, C.demo(), 'Exemplo carregado'); openMat(p.id, rec.id); },
    save: saveDraft,
    prev: () => { S.showPrev = !S.showPrev; render(); },
    vers: () => { S.showVers = !S.showVers; render(); },
    restorever: (el) => { const rec = mat(), v = rec.versions.find((x) => x.vid === el.dataset.v); S.draft = C.clone(v.data); pushVersion(rec, S.draft, 'Restaurada de ' + fmt(v.at)); logp(proj(), 'Versão restaurada'); persist(); S.dirty = false; toast('Versão restaurada como nova versão. Nada foi apagado.'); render(); },
    bup: (el) => { const i = +el.dataset.i, b = S.draft.blocks; if (i > 0) { [b[i - 1], b[i]] = [b[i], b[i - 1]]; S.dirty = true; render(); } },
    bdn: (el) => { const i = +el.dataset.i, b = S.draft.blocks; if (i < b.length - 1) { [b[i + 1], b[i]] = [b[i], b[i + 1]]; S.dirty = true; render(); } },
    bdel: (el) => { if (confirm('Remover este bloco? (Você pode recuperar pela versão anterior.)')) { S.draft.blocks.splice(+el.dataset.i, 1); S.dirty = true; render(); } },
    addblock: () => { const t = $('#newtype').value; S.draft.blocks.push({ id: C.uid('b'), type: t, title: C.BLOCK_TYPES[t][0], content: '', svg: '' }); S.dirty = true; render(); },
    addvis: () => {
      const svg = buildVis(); if (!svg) { toast('Dados insuficientes para esta figura. Veja o formato abaixo do campo.', true); return; }
      const desc = (svg.match(/<desc[^>]*>([^<]*)<\/desc>/) || [])[1] || '';
      S.draft.blocks.push({ id: C.uid('b'), type: 'visual', title: S.vis.title.trim() || 'Figura', content: desc.replace(/&amp;/g, '&'), svg }); S.dirty = true; render(); toast('Figura inserida no fim do material. Use ↑ para posicionar.');
    },
    addref: () => { S.draft.references.push({ authors: '', title: '', year: '', venue: '', doi: '', url: '', accessLevel: 'nao-verificado', verified: false }); S.dirty = true; render(); },
    delref: (el) => { S.draft.references.splice(+el.dataset.i, 1); S.dirty = true; render(); },
    mkposter: () => { const L = C.EPISTEMIC[S.draft.epistemicType].labels; S.draft.poster = { title: S.draft.title, subtitle: '', mascot: '', sections: L.map((l) => ({ label: l, title: '', text: '' })), goldTip: '', didYouKnow: '', attention: '', summary: [], theme: 'alegre' }; S.dirty = true; render(); },
    addsec: () => { S.draft.poster.sections.push({ label: 'Nova caixa', title: '', text: '' }); S.dirty = true; render(); },
    delsec: (el) => { S.draft.poster.sections.splice(+el.dataset.i, 1); S.dirty = true; render(); },
    addsum: () => { S.draft.poster.summary.push({ icon: '⭐', label: '', text: '' }); S.dirty = true; render(); },
    delsum: (el) => { S.draft.poster.summary.splice(+el.dataset.i, 1); S.dirty = true; render(); },
    copyimg: async () => { toast((await copy(C.buildImagePrompt(S.draft))) ? 'Prompt copiado. Cole no Gemini (Nano Banana).' : 'Não consegui copiar automaticamente.'); },
    setstyle: (el) => { if (!S.draft.poster) A.mkposter(); S.draft.poster.interiorStyle = el.dataset.v; S.dirty = true; scheduleAutosave(); render(); },
    dlbook: async () => dl(slug(S.draft.title) + '-apostila-completa.html', 'text/html', await inlineAssets(C.toApostila(S.draft))),
    printbook: async () => printHTML(await inlineAssets(C.toApostila(S.draft))),
    dlposter: async () => dl(slug(S.draft.title) + '-apostila-visual.html', 'text/html', await inlineAssets(C.toHTML(S.draft, { material: false }))),
    printposter: async () => printHTML(await inlineAssets(C.toHTML(S.draft, { material: false }))),
    dlhtml: async () => dl(slug(S.draft.title) + '.html', 'text/html', await inlineAssets(C.toHTML(S.draft))),
    printall: async () => printHTML(await inlineAssets(C.toHTML(S.draft))),
    dlmd: () => dl(slug(S.draft.title) + '.md', 'text/markdown', C.toMarkdown(S.draft)),
    dljson: () => dl(slug(S.draft.title) + '.json', 'application/json', JSON.stringify(C.normalize(S.draft), null, 2)),
    dlsvg: (el) => { const b = S.draft.blocks[+el.dataset.i]; dl(slug(b.title) + '.svg', 'image/svg+xml', C.sanitizeSvg(b.svg)); },
    review: (el) => { S.draft.meta.teacherReview = el.checked ? { done: true, at: new Date().toISOString() } : { done: false }; S.dirty = true; render(); },
  };

  document.addEventListener('click', (e) => { const el = e.target.closest('[data-a]'); if (!el || el.type === 'checkbox' || el.type === 'file') return; if (A[el.dataset.a]) A[el.dataset.a](el, e); });
  document.addEventListener('change', (e) => { const el = e.target; if ((el.type === 'checkbox' || el.type === 'file') && el.dataset.a && A[el.dataset.a]) A[el.dataset.a](el, e); else if (el.dataset.vis === 'kind') { S.vis.kind = el.value; S.vis.text = { numberLine: '-6, 6, -2, 5', timeline: '1789 | Revolução Francesa\n1822 | Independência do Brasil', flow: 'Observar\nFormular hipótese\nTestar\nConcluir', conceptMap: 'Tema central\nConceito A\nConceito B\nConceito C' }[el.value]; render(); } });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.form) { S.form[el.dataset.form] = el.value; return; }
    if (el.dataset.vis) { if (el.dataset.vis !== 'kind') S.vis[el.dataset.vis] = el.value; return; }
    if (el.dataset.f) {
      setPath(el.dataset.f, el.type === 'checkbox' ? el.checked : el.dataset.lines ? el.value.split('\n').map((x) => x.trim()).filter(Boolean) : el.value);
      S.dirty = true; const m = $('#dirtymark'); if (m) { m.className = 'dirty'; m.textContent = '● salvando...'; }
      scheduleAutosave();
      if (S.tab === 'poster' && S.draft.poster) { const pv = $('#posterPreview'); if (pv) pv.innerHTML = (S.draft.poster.coverClean !== false ? '<div style="margin-bottom:16px">' + C.renderCleanCover(S.draft) + '</div>' : '') + C.renderPoster(S.draft.poster, S.draft.author); }
    }
  });
  window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

  const st = document.createElement('style'); st.textContent = C.COVER_CSS + '\n' + C.POSTER_CSS; document.head.appendChild(st);
  $('#ver').textContent = 'v' + C.VERSION;
  render();
  window.__mathlab = { S, lib: () => lib, A, render };
})();

</script>
</body>
</html>
